name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  VPK_VERSION: '1.2.161'

jobs:
  # Every push / PR: build and test. Blocks the merge when red.
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build "Turn One Link.sln" -c Release

      - name: Test
        run: dotnet test "Turn One Link.sln" -c Release --no-build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tag v1.2.3 (stable) or v1.2.3-beta (beta channel): publish, pack with Velopack, sign when the
  # Azure Trusted Signing secrets exist, and upload a GitHub release the app updates from.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, secret-scan]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check tag matches csproj version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "Turn One Link.csproj"
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $tag = "${{ github.ref_name }}".TrimStart('v') -replace '-beta$',''
          if ($tag -ne $version) { Write-Error "Tag $tag does not match csproj <Version> $version"; exit 1 }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Write signing metadata
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          @{
            Endpoint = "${{ secrets.AZURE_SIGNING_ENDPOINT }}"
            CodeSigningAccountName = "${{ secrets.AZURE_SIGNING_ACCOUNT }}"
            CertificateProfileName = "${{ secrets.AZURE_SIGNING_PROFILE }}"
          } | ConvertTo-Json | Set-Content azure-trusted-signing.json

      # Azure credentials for signing come from these env vars (DefaultAzureCredential).
      - name: Build, pack and sign
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $channel = if ("${{ github.ref_name }}".EndsWith("-beta")) { "beta" } else { "stable" }
          $sign = if (Test-Path azure-trusted-signing.json) { "azure-trusted-signing.json" } else { "" }
          if (-not $sign) { Write-Warning "No signing secrets — this release is UNSIGNED." }
          ./build_installer.ps1 -Channel $channel -SignMetadata $sign -SentryDsn "${{ secrets.SENTRY_DSN }}"

      - name: Upload GitHub release
        shell: pwsh
        run: |
          $channel = if ("${{ github.ref_name }}".EndsWith("-beta")) { "beta" } else { "stable" }
          $uploadArgs = @("upload", "github",
            "--repoUrl", "https://github.com/${{ github.repository }}",
            "--token", "${{ secrets.GITHUB_TOKEN }}",
            "--outputDir", "./Releases", "--channel", $channel,
            "--tag", "${{ github.ref_name }}", "--releaseName", "Turn One Link ${{ github.ref_name }}",
            "--publish")
          if ($channel -eq "beta") { $uploadArgs += "--pre" }
          & vpk @uploadArgs
